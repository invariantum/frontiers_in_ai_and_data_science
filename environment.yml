name: xeus-kernel
channels:
  - https://repo.prefix.dev/emscripten-forge-dev
  - https://repo.prefix.dev/conda-forge
dependencies:
  - xeus-python

  # Core data science
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels

  # Visualisation and interactivity
  - matplotlib
  - seaborn
  - plotly
  - ipywidgets

  # Association rules, maths, graphs, images
  - mlxtend
  - sympy
  - networkx
  - pillow

  # Pure-Python packages from PyPI.
  # These are installed WITHOUT their dependencies, so each dependency is listed too.
  - pip:
      # Excel (.xlsx needs openpyxl 3.1.5+, the browser channel only has 3.0.9; .xls needs xlrd)
      - et-xmlfile
      - openpyxl==3.1.5
      - xlrd
      # HTML tables: pd.read_html(..., flavor='bs4')
      - beautifulsoup4
      - soupsieve
      - html5lib
      - six
      - webencodings
      # SQL: pd.to_sql / pd.read_sql with SQLAlchemy
      - sqlalchemy
      - typing-extensions
      # Missing-data plots (Week 3 Titanic notebook)
      - missingno
      # Pretty tables
      - tabulate
